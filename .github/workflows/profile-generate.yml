name: Generate Profile Cards & Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Allow GitHub Actions to push generated files
permissions:
  contents: write

jobs:

  # ==============================
  # PROFILE SUMMARY CARDS
  # ==============================
  summary-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: stfu-diwakar
          THEME: tokyonight

      - name: Commit and Push Card SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/ -f

          if ! git diff --staged --quiet; then
            git commit -m "Update profile summary cards"
            git push origin HEAD:main
          else
            echo "No changes to profile cards."
          fi

  # ==============================
  # CONTRIBUTION SNAKE
  # ==============================
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: stfu-diwakar
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
